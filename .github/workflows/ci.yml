name: ci

# The dogfood run IS the CI gate: the committed labs/crashledger.json is the
# baseline; a fresh run fails this workflow iff a previously-REFUSED check
# regressed or a NEW EXPLOITED finding appears (PRD section 7). Accepted risks
# (owner+bound on file) never re-alarm.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Docs gates (frontmatter, links, style, fiction)
        run: npm run lint:docs

      # The pack lane (packstruct#1 ask #1, adopted 2026-10-24; npm switch
      # 2026-10-24 once packstruct published): our shipped pack manifests are
      # linted against packstruct SPEC v1 via an EXACT devDependency
      # ("packstruct": "1.0.0", no float - same commit -> same findings
      # applies to the linter too). Bumping the pin is a deliberate review:
      # re-transcribe the SPEC transcript + re-derive any moved specKey in
      # the SAME commit. History: the lane ran from a GitHub clone pinned to
      # the spec commit b0e305034c974ad133b83e3b1c3cb27094d1de46 until
      # packstruct published; the byte-exact transcript + battery receipts
      # stay tied to that SHA in labs/packstruct-backfill/. The npm wrapper
      # ships the SAME spec path (spec/SPEC.md), so verify-spec.mjs reads it
      # straight out of node_modules - no clone anywhere.
      - name: Pack lane - packstruct lint packs/ against SPEC v1 (npm, exact-pinned)
        run: |
          npx --no-install packstruct lint packs
          node labs/packstruct-backfill/verify-spec.mjs node_modules/packstruct

      # web/dist is gitignored (build-only), but it is real attack surface:
      # the site pack's HTML/sitemap attacks need the prerendered artifacts.
      # Build them so the suite exercises full artifact coverage; the pack
      # itself degrades to honest skips when the build is absent.
      - name: Build the site artifacts (web/dist for the site pack)
        run: npm install --prefix web --no-audit --no-fund && npm run build --prefix web

      - name: Test suite
        run: npm test

      - name: Dogfood - attack our own fixture against the baseline
        run: node bin/crashtest.js run

      - name: Snapshot report (on failure, shows what changed)
        if: failure()
        run: tail -30 labs/hardening.md
