name: ci

# The dogfood run IS the CI gate: the committed labs/crashledger.json is the
# baseline; a fresh run fails this workflow iff a previously-REFUSED check
# regressed or a NEW EXPLOITED finding appears (PRD section 7). Accepted risks
# (owner+bound on file) never re-alarm.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Docs gates (frontmatter, links, style, fiction)
        run: npm run lint:docs

      # The pack lane (packstruct#1 ask #1, adopted 2026-10-24): our shipped
      # pack manifests are linted against packstruct SPEC v1, pinned to an
      # exact commit so the same commit -> same findings rule holds here too.
      # The verbatim transcript lives at labs/packstruct-backfill/SPEC-v1.md;
      # verify-spec.mjs keeps the transcript and the pin honest in the same
      # breath. Bumping the pinned SHA is a deliberate review: re-transcribe
      # the spec + re-derive any moved specKey in the SAME commit.
      # CRITICAL: clone OUTSIDE the checkout (repo-root clones get walked by
      # bare `node --test` discovery - it matches test/**/* recursively - and
      # the FIRST lane commit (471a581) ran packstruct's own suite inside our
      # npm test and failed.). /tmp is ephemeral on the runner.
      - name: Pack lane - packstruct lint packs/ against SPEC v1 (pinned)
        run: |
          PIN=b0e305034c974ad133b83e3b1c3cb27094d1de46
          LANE=/tmp/packstruct-lane
          rm -rf "$LANE"
          git clone --quiet --no-checkout --filter=blob:none https://github.com/dhaupin/packstruct.git "$LANE"
          git -C "$LANE" fetch --quiet --depth 1 origin "$PIN"
          git -C "$LANE" checkout --quiet FETCH_HEAD
          node "$LANE/bin/cli.mjs" lint packs
          node labs/packstruct-backfill/verify-spec.mjs "$LANE"

      # web/dist is gitignored (build-only), but it is real attack surface:
      # the site pack's HTML/sitemap attacks need the prerendered artifacts.
      # Build them so the suite exercises full artifact coverage; the pack
      # itself degrades to honest skips when the build is absent.
      - name: Build the site artifacts (web/dist for the site pack)
        run: npm install --prefix web --no-audit --no-fund && npm run build --prefix web

      - name: Test suite
        run: npm test

      - name: Dogfood - attack our own fixture against the baseline
        run: node bin/crashtest.js run

      - name: Snapshot report (on failure, shows what changed)
        if: failure()
        run: tail -30 labs/hardening.md
