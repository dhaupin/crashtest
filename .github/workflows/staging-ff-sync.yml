# staging-ff-sync - keep the permanent staging integration branch a fast-forward
# mirror of main (monoforge#20, the family staging flow), and self-heal it if it
# is ever deleted.
#
# A merge-commit promotion puts a commit on main that staging lacks, so the two
# drift by one on every promotion even when the flow is followed exactly. The
# sync step is required: staging is a mirror of the integration state, never a
# second line of history, so a fast-forward is the only move - never a merge,
# never a force-push.
#
# Non-destructive by construction: `git push origin origin/main:staging` with a
# fast-forward-only refspec. If staging has moved ahead of main the push is
# refused and the job fails loudly, which is the signal that a commit landed on
# staging that main does not have.
#
# Self-healing (the delete trap): `gh pr merge --delete-branch` deletes the
# PR's HEAD branch, and a promote PR's head IS staging - so the one command
# that reads as tidy housekeeping deletes the permanent branch. Two triggers
# cover it: the `delete` event restores staging the moment it is removed, and
# the `push: main` pass restores it too if a run ever lands first. The restore
# target is main, the same commit the fast-forward would set, so both
# invariants (staging == main, staging never a second line of history) hold.
#
# This job cannot PREVENT a delete - only the owner can, by restricting
# deletion of `staging` (a ruleset or branch protection), which is a repo-admin
# action, not a repo-file one. This is the belt for that missing suspender.

name: Sync staging to main

on:
  push:
    branches: [main]
  delete:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-ff-sync
  cancel-in-progress: false

jobs:
  ff-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward (or restore) staging to main
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          DELETED_REF: ${{ github.event.ref }}
          DELETED_TYPE: ${{ github.event.ref_type }}
        run: |
          set -euo pipefail

          # A delete event for anything but the staging BRANCH is not ours.
          if [ "$EVENT" = "delete" ] && { [ "$DELETED_TYPE" != "branch" ] || [ "$DELETED_REF" != "staging" ]; }; then
            echo "delete event for '$DELETED_REF' ($DELETED_TYPE) - not the staging branch, nothing to do."
            exit 0
          fi

          git init -q .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q origin main

          if git fetch -q origin staging 2>/dev/null; then
            # Fast-forward only: the refspec requires staging to be an ancestor
            # of main. `git push` refuses a non-fast-forward update, so a
            # divergence fails the job instead of rewriting history.
            git push origin origin/main:refs/heads/staging
          else
            echo "staging is missing - recreating it at main (the fast-forward target)."
            git push origin origin/main:refs/heads/staging
          fi
