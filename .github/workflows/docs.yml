# crashtest docs - a THIN caller of THE one docs lane (dhaupin/freestruct).
#
# The runbook (Jekyll, the hardened pagefind scrape, the pinned freestruct
# post-build layer, the optional crashtest dogfood campaign, the Pages upload,
# the main-gated deploy) lives ONCE in the lane. This file keeps only what is
# per-repo: the trigger, the permissions, the concurrency group, and the input
# pins that are this repo's. It used to be a hand-copied runbook (one of five),
# which is the drift the consolidation removed.
#
# This repo's docs config is the LEGACY name (docs/ssr-config.yml); freestruct
# discovery reads it as back-compat, so nothing is renamed. crashtest dogfoods
# itself in .github/workflows/ci.yml, so the lane's dogfood leg stays off here.
# freestruct-version is pinned EXACT at 1.1.0 (issue #36).
# The docs truth gates (npm run lint:docs) run in test.yml/ci.yml, not here:
# a workflow_call caller cannot carry extra steps, so they stay in the battery.
name: Deploy docs

on:
  push:
    branches: [main, staging]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    # Pinned to the lane's SHA (pins, never floats): a moving @main would let
    # the runbook change under us between runs.
    uses: dhaupin/freestruct/.github/workflows/docs-lane.yml@22bb7e9b2634d6cdd966963d9e25c7f892577276 # main
    with:
      ruby-version: '3.4'
      freestruct-version: '1.1.0'
