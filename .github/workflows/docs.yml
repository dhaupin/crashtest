name: Deploy Docs

# Docs deploy as a thin caller of the family's one reusable lane
# (crashtest#38; the runbook lives in dhaupin/flowforge's docs-build.yml,
# promoted to workflow_call by their issue #9). The hand-copied build steps
# that lived here (Jekyll, the hardened pagefind scrape, the search index,
# the pinned freestruct layer, the artifact upload) are THE SAME STEPS in
# the same order - one copy now, so the seven-repo drift table in #38 stops
# growing. The caller contract: this file owns permissions, concurrency,
# the trigger list and the deploy job; the lane only builds + uploads.
#
# Inputs honored (verified against the published freestruct@1.1.0 tarball
# before this swap, crashtest#38 receipt):
#   - ruby-version 3.4 (the lane defaults 3.2 - this repo's bundler lock
#     is built for 3.4, so we pass ours explicitly)
#   - freestruct-version pinned EXACT '1.1.0', not the lane's ^1.1.0
#     default range - the six-centuries lesson (issue #36) is a contract
#     here: a floating install is a random deploy, bump the exact number
#     the day freestruct ships the next release
#   - pagefind-version stays 'latest' (the lane's hardened scrape with the
#     GITHUB_TOKEN + version-guard receipt is the same code that lived here)
#   - the lane runs `node node_modules/freestruct/engine/inject.js`, this
#     repo previously ran `node node_modules/freestruct/bin/freestruct.mjs`
#     - byte-verified equivalent: the bin is a thin shim forwarding to the
#     same runInject(); and freestruct's config discovery accepts our
#     docs/ssr-config.yml under its legacy name (freestruct.config.yml
#     first, ssr-config.yml back-compat, nothing renamed)

on:
  push:
    branches: [main, staging]
    paths: ['docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

# Permissions for GitHub Pages deployment (the deploy job consumes the
# artifact the lane uploads)
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    uses: dhaupin/flowforge/.github/workflows/docs-build.yml@main
    with:
      ruby-version: '3.4'
      freestruct-version: '1.1.0'

  deploy:
    needs: build
    # Pages is production: only main deploys. staging riding the trigger list
    # keeps its content covered by the BUILD job - never the deploy (the
    # staging-branch pattern, crashtest#53, poststruct#32).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
