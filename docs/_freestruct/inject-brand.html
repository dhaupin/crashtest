<!-- freestruct SEO template — crashtest docs edition.
     The Jekyll layout (_layouts/default.html) already emits canonical,
     og:title/description/url/type/site_name, so this template adds ONLY the
     layer the layout lacks — keeping inject output dupe-free:
       twitter card + title, an og:image (resolved to the main site card),
       and one SoftwareApplication JSON-LD.
     Placeholders honored: {{siteUrl}}, {{siteName}}, {{siteDescription}}. -->

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{siteName}} Docs">
<meta name="twitter:description" content="{{siteDescription}}">
<meta property="og:image" content="https://crashtest.creadev.org/og-image.png">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "{{siteName}}",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Node.js",
  "url": "{{siteUrl}}",
  "description": "{{siteDescription}}",
  "offers": { "@type": "Offer", "price": 0, "priceCurrency": "USD" },
  "author": { "@type": "Person", "name": "dhaupin", "url": "https://github.com/dhaupin" }
}
</script>

<!-- injected by freestruct: https://github.com/dhaupin/freestruct -->
