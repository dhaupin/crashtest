# freestruct config - crashtest docs (docs.creadev.org/crashtest)
# Runs post-Jekyll: npx freestruct (contract: this file + _freestruct
# template relative to the repo root; output = Jekyll's _site).
site:
  name: Crashtest
  # Origin only - page paths carry /crashtest/ via Jekyll's baseurl, and
  # freestruct joins siteUrl + pageUrl for canonical/sitemap/OG.
  url: https://docs.creadev.org
  description: Seeded, in-process adversarial QA for agent-built apps - quick starts, playbooks per framework, the attack catalog, and the ledger CI gates on.

# Jekyll's own output directory, relative to this config's docs/ dir (the
# pinned freestruct layer resolves config.outputDir against the config's
# own folder; the old root-relative `docs/_site` value doubled under the
# reorganized layer and red-lighted the deploy).
outputDir: _site

# Page URLs are emitted under /crashtest/ - strip the prefix when freestruct
# computes per-page paths.
basePath: /crashtest

# Verification layer: fail the build on broken internal links (truth pass).
linkCheck: true

# Reading-time + last-modified are free wins for a docs site.
readingTime: true
lastModified: true

# Sitemap/robots/404: freestruct generates all three; Jekyll also emits a
# sitemap.xml in docs/ root - freestruct's covers _site, which is what
# ships. Keep both, harmless.
generateSitemap: true
generateRobots: true
generate404: true

# No RSS, no search index (the lean layout has no search UI yet).
generateFeed: false
searchIndex: false

# No CDN purge hooks: GH Pages invalidates on deploy itself.
