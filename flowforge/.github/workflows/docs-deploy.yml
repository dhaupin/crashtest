name: Deploy Docs

# Builds docs/ (Jekyll) then runs the freestruct post-build SEO layer on
# _site (canonical/description, og:image + twitter, JSON-LD, sitemap, robots,
# 404, cache-bust hash, last-modified, internal-link check). The hardened
# pagefind scrape + the PINNED freestruct install are the two receipts this
# rig keeps for you: unauthenticated api.github.com scrapes get rate-limited
# from shared runner IPs (an empty VERSION yields a malformed asset URL and
# tar fails on the 404 HTML body), and an unpinned github:-install is a
# random deploy (freestruct reorganized docs/lib mid-day once - PINNED, the
# all-caps lesson is the point).

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs-deploy.yml']
  workflow_dispatch:

# Permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: './docs'

      - name: Build Jekyll
        run: |
          cd docs
          bundle exec jekyll build
        env:
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pagefind search index (same as vant's docs deploy): the layout's
      # modal imports /crashtest/pagefind/pagefind.js, so the index MUST be
      # built into _site or search reports unavailable. Token-authenticated
      # release scrape: unauthenticated api.github.com calls from shared
      # runner IPs get rate-limited, an empty VERSION yields a malformed
      # asset URL, and tar then fails on the 404 HTML body - refuse loudly
      # on an unparseable tag instead of downloading garbage (vant lesson).
      - name: Download Pagefind
        working-directory: docs
        run: |
          VERSION=$(curl -sL \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Pagefind/pagefind/releases/latest" \
            | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Could not resolve the latest pagefind tag (got '$VERSION') - likely an API failure."; exit 1 ;;
          esac
          echo "pagefind version: v${VERSION}"
          curl -sL --retry 3 --retry-delay 5 \
            "https://github.com/pagefind/pagefind/releases/download/v${VERSION}/pagefind-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o pagefind.tar.gz
          tar -xzf pagefind.tar.gz
          rm pagefind.tar.gz
          chmod +x pagefind

      - name: Create search index
        working-directory: docs
        run: ./pagefind --site _site

      # freestruct consumes, relative to the REPO ROOT:
      #   docs/ssr-config.yml (config) / docs/_freestruct/inject-brand.html
      #   (template) / docs/_site (output; default arg)
      # Install from the GitHub source tarball - the npm registry name is
      # not published yet, and the package bin lacks a shebang, so invoke
      # inject.js with node directly (works everywhere; revisit once
      # freestruct is npm-published with a proper bin).
      # PINNED to the last commit carrying docs/lib at the documented path:
      # unpinned github:-installs float to freestruct's default HEAD, which
      # moved/reorganized docs/lib mid-day on 2026-10-21 (six-centuries
      # lesson: a floating install is a random deploy), red-lighting the
      # docs deploys until it got pinned. Bump the pin when freestruct
      # republishes the layer - never float again.
      - name: Install freestruct
        run: npm install --no-save --no-audit --no-fund 'github:dhaupin/freestruct#dfb30aa498'

      - name: Run freestruct post-build layer
        run: node node_modules/freestruct/docs/lib/inject.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
